<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const theme = localStorage.getItem('meridian-theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
    <!-- Preconnect to font providers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Load the font stylesheets directly, instead of via @import in CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@700&display=swap" />


    <meta name="theme-color" content="#06b6d4" />
    <title>Meridian IT Solutions — Computer, Laptop & IT Maintenance Services</title>
    <meta
      name="description"
      content="Meridian IT Solutions provides expert computer maintenance, laptop repair, AMC services, refurbished device sales, e-waste management, and IT support. Trusted by businesses for over a decade."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meridian IT Solutions — IT Maintenance & Repair" />
    <meta
      property="og:description"
      content="Expert computer, laptop, and IT maintenance services. AMC, repairs, refurbished sales, e-waste management and more."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
